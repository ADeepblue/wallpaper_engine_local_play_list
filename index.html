<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Advanced Wallpaper Slideshow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

        /* 壁纸层：使用 contain 确保严格留黑边、绝对不拉伸、完整展示图片 */
        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            z-index: 1;
        }
        .active { opacity: 1; }

        /* 底部控制栏外壳：提高触发高度并增加底边距，彻底解决 Windows 任务栏遮挡问题 */
        #control-trigger {
            position: absolute;
            bottom: 0;
            left: 15%;
            width: 70%;
            height: 140px;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 50px; /* 避开 Windows 任务栏（约 40-50px） */
        }

        /* 控制面板样式 */
        #control-panel {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 25px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        /* 鼠标悬停触发区域时，显示控制栏 */
        #control-trigger:hover #control-panel {
            opacity: 1;
            transform: translateY(0);
        }

        /* 按钮通用样式 */
        .btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 24px;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            transition: background 0.2s;
            user-select: none;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.2); }
        .btn:active { transform: scale(0.95); }
        #play-btn { font-size: 28px; }
    </style>
</head>
<body>

    <div id="bg1" class="slide active"></div>
    <div id="bg2" class="slide"></div>

    <!-- 底部悬浮控制栏 -->
    <div id="control-trigger">
        <div id="control-panel">
            <button class="btn" id="prev-btn" title="上一张 (← / PageUp / 向上滚动)">⏮</button>
            <button class="btn" id="play-btn" title="播放/暂停 (空格)">⏸</button>
            <button class="btn" id="next-btn" title="下一张 (→ / PageDown / 向下滚动)">⏭</button>
        </div>
    </div>

    <!-- 动态图片列表注入区块（图片存放在 img/ 目录下） -->
    <!--IMAGE_LIST_START-->
<script id="imageList">
    const rawImages = ['img/1.png'];
</script>
<!--IMAGE_LIST_END-->

    <script>
        let playlist = [];        // 实际播放列表（根据顺序/随机生成）
        let currentIndex = 0;
        let isBg1Active = true;
        let slideshowTimer = null;
        let isInitialLoad = true;

        // WE 绑定的配置变量
        let cfgAutoPlay = true;
        let cfgInterval = 10000;
        let cfgPlayMode = 'order';

        // 安全路径转义（支持特殊字符如 #、?、空格等）
        function encodeImagePath(path) {
            return path.split('/').map(segment => encodeURIComponent(segment)).join('/');
        }

        // 1. 根据 WE 设置初始化播放列表
        function initPlaylist() {
            if (typeof rawImages === 'undefined' || rawImages.length === 0) return;
            let currentTrack = playlist[currentIndex] || rawImages[0];

            if (cfgPlayMode === 'shuffle') {
                let shuffled = [...rawImages];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                playlist = shuffled;
            } else {
                playlist = [...rawImages];
            }

            let newIdx = playlist.indexOf(currentTrack);
            currentIndex = newIdx !== -1 ? newIdx : 0;
        }

        // 2. 核心切换函数
        function switchSlide(direction = 1) {
            if (playlist.length === 0) return;

            currentIndex = (currentIndex + direction + playlist.length) % playlist.length;
            const nextImgUrl = encodeImagePath(playlist[currentIndex]);

            const activeEl = document.getElementById(isBg1Active ? 'bg1' : 'bg2');
            const inactiveEl = document.getElementById(isBg1Active ? 'bg2' : 'bg1');

            inactiveEl.style.backgroundImage = `url('${nextImgUrl}')`;
            inactiveEl.classList.add('active');
            activeEl.classList.remove('active');

            isBg1Active = !isBg1Active;
        }

        // 3. 自动化定时器控制
        function startSlideshow() {
            clearInterval(slideshowTimer);

            if (isInitialLoad && playlist.length > 0) {
                document.getElementById('bg1').style.backgroundImage = `url('${encodeImagePath(playlist[currentIndex])}')`;
                isInitialLoad = false;
            }

            if (cfgAutoPlay && playlist.length > 1) {
                slideshowTimer = setInterval(() => {
                    switchSlide(1);
                }, cfgInterval);
                document.getElementById('play-btn').innerText = '⏸';
            } else {
                document.getElementById('play-btn').innerText = '▶';
            }
        }

        // 4. 底部按钮交互
        document.getElementById('prev-btn').addEventListener('click', () => {
            switchSlide(-1);
            if (cfgAutoPlay) startSlideshow();
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            switchSlide(1);
            if (cfgAutoPlay) startSlideshow();
        });

        document.getElementById('play-btn').addEventListener('click', () => {
            cfgAutoPlay = !cfgAutoPlay;
            startSlideshow();
        });

        // 5. 键盘方向键与快捷键交互
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'ArrowUp') {
                switchSlide(-1);
                if (cfgAutoPlay) startSlideshow();
            } else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === 'ArrowDown') {
                switchSlide(1);
                if (cfgAutoPlay) startSlideshow();
            } else if (e.key === ' ') {
                cfgAutoPlay = !cfgAutoPlay;
                startSlideshow();
            }
        });

        // 6. 鼠标滚轮切页交互（带防抖）
        let wheelCooldown = false;
        window.addEventListener('wheel', (e) => {
            if (wheelCooldown) return;
            wheelCooldown = true;
            setTimeout(() => { wheelCooldown = false; }, 300);

            if (e.deltaY > 0) {
                switchSlide(1);
                if (cfgAutoPlay) startSlideshow();
            } else if (e.deltaY < 0) {
                switchSlide(-1);
                if (cfgAutoPlay) startSlideshow();
            }
        }, { passive: true });

        // 7. 监听并实时响应 Wallpaper Engine 内部的开关和配置
        window.wallpaperPropertyListener = {
            applyUserProperties: function(properties) {
                let needReinit = false;

                if (properties.autoPlay) {
                    cfgAutoPlay = properties.autoPlay.value;
                }
                if (properties.interval) {
                    cfgInterval = properties.interval.value * 1000;
                }
                if (properties.playMode) {
                    if (cfgPlayMode !== properties.playMode.value) {
                        cfgPlayMode = properties.playMode.value;
                        needReinit = true;
                    }
                }
                if (properties.fade) {
                    const fadeTime = properties.fade.value;
                    document.getElementById('bg1').style.transition = `opacity ${fadeTime}s ease-in-out`;
                    document.getElementById('bg2').style.transition = `opacity ${fadeTime}s ease-in-out`;
                }

                if (typeof rawImages !== 'undefined' && rawImages.length > 0) {
                    if (needReinit) initPlaylist();
                    startSlideshow();
                }
            }
        };

        // 立即初始化
        if (typeof rawImages !== 'undefined' && rawImages.length > 0) {
            initPlaylist();
            startSlideshow();
        }
    </script>
</body>
</html>
