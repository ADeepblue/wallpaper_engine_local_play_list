<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Advanced Wallpaper Slideshow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        
        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            z-index: 1;
        }
        .active { opacity: 1; }

        #control-trigger {
            position: absolute;
            bottom: 0;
            left: 25%;
            width: 50%;
            height: 100px;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #control-panel {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 25px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }

        #control-trigger:hover #control-panel {
            opacity: 1;
            transform: translateY(0);
        }

        .btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 24px;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.2); }
        .btn:active { transform: scale(0.95); }
        #play-btn { font-size: 28px; }
    </style>
</head>
<body>

    <div id="bg1" class="slide active"></div>
    <div id="bg2" class="slide"></div>

    <!-- 底部悬浮控制栏 -->
    <div id="control-trigger">
        <div id="control-panel">
            <button class="btn" id="prev-btn" title="上一张">⏮</button>
            <button class="btn" id="play-btn" title="播放/暂停">⏸</button>
            <button class="btn" id="next-btn" title="下一张">⏭</button>
        </div>
    </div>

    <script>
        let playlist = [];
        let currentIndex = 0;
        let isBg1Active = true;
        let slideshowTimer = null;

        let cfgAutoPlay = true;
        let cfgInterval = 10000;
        let cfgPlayMode = 'shuffle';

        function initPlaylist() {
            if (rawImages.length === 0) return;
            let currentTrack = playlist[currentIndex] || rawImages[0];

            if (cfgPlayMode === 'shuffle') {
                let shuffled = [...rawImages];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                playlist = shuffled;
            } else {
                playlist = [...rawImages];
            }

            let newIdx = playlist.indexOf(currentTrack);
            currentIndex = newIdx !== -1 ? newIdx : 0;
        }

        function switchSlide(direction = 1) {
            if (playlist.length === 0) return;

            currentIndex = (currentIndex + direction + playlist.length) % playlist.length;
            const nextImgUrl = playlist[currentIndex];

            const activeEl = document.getElementById(isBg1Active ? 'bg1' : 'bg2');
            const inactiveEl = document.getElementById(isBg1Active ? 'bg2' : 'bg1');

            inactiveEl.style.backgroundImage = `url('${encodeURI(nextImgUrl)}')`;
            inactiveEl.classList.add('active');
            activeEl.classList.remove('active');

            isBg1Active = !isBg1Active;
        }

        function startSlideshow() {
            clearInterval(slideshowTimer);

            if (playlist.length > 0) {
                document.getElementById('bg1').style.backgroundImage = `url('${encodeURI(playlist[currentIndex])}')`;
            }

            if (cfgAutoPlay && playlist.length > 1) {
                slideshowTimer = setInterval(() => {
                    switchSlide(1);
                }, cfgInterval);
                document.getElementById('play-btn').innerText = '⏸';
            } else {
                document.getElementById('play-btn').innerText = '▶';
            }
        }

        document.getElementById('prev-btn').addEventListener('click', () => {
            switchSlide(-1);
            if (cfgAutoPlay) startSlideshow();
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            switchSlide(1);
            if (cfgAutoPlay) startSlideshow();
        });

        document.getElementById('play-btn').addEventListener('click', () => {
            cfgAutoPlay = !cfgAutoPlay;
            startSlideshow();
        });

        window.wallpaperPropertyListener = {
            applyUserProperties: function(properties) {
                let needReinit = false;

                if (properties.autoPlay) cfgAutoPlay = properties.autoPlay.value;
                if (properties.interval) cfgInterval = properties.interval.value * 1000;
                if (properties.playMode) {
                    if (cfgPlayMode !== properties.playMode.value) {
                        cfgPlayMode = properties.playMode.value;
                        needReinit = true;
                    }
                }
                if (properties.fade) {
                    const fadeTime = properties.fade.value;
                    document.getElementById('bg1').style.transition = `opacity ${fadeTime}s ease-in-out`;
                    document.getElementById('bg2').style.transition = `opacity ${fadeTime}s ease-in-out`;
                }

                if (typeof rawImages !== 'undefined' && rawImages.length > 0) {
                    if (needReinit) initPlaylist();
                    startSlideshow();
                }
            }
        };

        // 脚本执行入口
        if (typeof rawImages !== 'undefined' && rawImages.length > 0) {
            initPlaylist();
            startSlideshow();
        }
    </script>
</body>
</html>
