<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Advanced Wallpaper Slideshow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

        /* 壁纸层：使用 contain 确保严格留黑边、绝对不拉伸、完整展示图片 */
        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            z-index: 1;
        }
        .active { opacity: 1; }

        /* 底部控制栏外壳：鼠标移到中下方时触发显示 */
        #control-trigger {
            position: absolute;
            bottom: 0;
            left: 25%;
            width: 50%;
            height: 100px;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 控制面板样式 */
        #control-panel {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 25px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }

        /* 鼠标悬停触发区域时，显示控制栏 */
        #control-trigger:hover #control-panel {
            opacity: 1;
            transform: translateY(0);
        }

        /* 按钮通用样式 */
        .btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 24px;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.2); }
        .btn:active { transform: scale(0.95); }
        #play-btn { font-size: 28px; }
    </style>
</head>
<body>

    <div id="bg1" class="slide active"></div>
    <div id="bg2" class="slide"></div>

    <!-- 底部悬浮控制栏 -->
    <div id="control-trigger">
        <div id="control-panel">
            <button class="btn" id="prev-btn" title="上一张">⏮</button>
            <button class="btn" id="play-btn" title="播放/暂停">⏸</button>
            <button class="btn" id="next-btn" title="下一张">⏭</button>
        </div>
    </div>

    <!-- 动态图片列表注入区块（配合你的 bat 脚本使用） -->
    <!--IMAGE_LIST_START-->
    <script id="imageList">
        const rawImages = ['1.png', '2.png'];
    </script>
    <!--IMAGE_LIST_END-->

    <script>
        let playlist = [];        // 实际播放列表（根据顺序/随机生成）
        let currentIndex = 0;
        let isBg1Active = true;
        let slideshowTimer = null;

        // WE 绑定的配置变量
        let cfgAutoPlay = true;
        let cfgInterval = 10000;
        let cfgPlayMode = 'shuffle'; // 默认随机乱序

        // 1. 根据 WE 设置初始化播放列表
        function initPlaylist() {
            if (typeof rawImages === 'undefined' || rawImages.length === 0) return;
            let currentTrack = playlist[currentIndex] || rawImages[0];

            if (cfgPlayMode === 'shuffle') {
                let shuffled = [...rawImages];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                playlist = shuffled;
            } else {
                playlist = [...rawImages];
            }

            let newIdx = playlist.indexOf(currentTrack);
            currentIndex = newIdx !== -1 ? newIdx : 0;
        }

        // 2. 核心切换函数（使用 encodeURI 妥善处理英文、空格及特殊字符文件名）
        function switchSlide(direction = 1) {
            if (playlist.length === 0) return;

            currentIndex = (currentIndex + direction + playlist.length) % playlist.length;
            const nextImgUrl = encodeURI(playlist[currentIndex]);

            const activeEl = document.getElementById(isBg1Active ? 'bg1' : 'bg2');
            const inactiveEl = document.getElementById(isBg1Active ? 'bg2' : 'bg1');

            inactiveEl.style.backgroundImage = `url('${nextImgUrl}')`;
            inactiveEl.classList.add('active');
            activeEl.classList.remove('active');

            isBg1Active = !isBg1Active;
        }

        // 3. 自动化定时器控制
        function startSlideshow() {
            clearInterval(slideshowTimer);

            if (playlist.length > 0) {
                document.getElementById('bg1').style.backgroundImage = `url('${encodeURI(playlist[currentIndex])}')`;
            }

            if (cfgAutoPlay && playlist.length > 1) {
                slideshowTimer = setInterval(() => {
                    switchSlide(1);
                }, cfgInterval);
                document.getElementById('play-btn').innerText = '⏸';
            } else {
                document.getElementById('play-btn').innerText = '▶';
            }
        }

        // 4. 底部按钮交互
        document.getElementById('prev-btn').addEventListener('click', () => {
            switchSlide(-1);
            if (cfgAutoPlay) startSlideshow();
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            switchSlide(1);
            if (cfgAutoPlay) startSlideshow();
        });

        document.getElementById('play-btn').addEventListener('click', () => {
            cfgAutoPlay = !cfgAutoPlay;
            startSlideshow();
        });

        // 5. 监听并实时响应 Wallpaper Engine 内部的开关和滑块配置
        window.wallpaperPropertyListener = {
            applyUserProperties: function(properties) {
                let needReinit = false;

                if (properties.autoPlay) {
                    cfgAutoPlay = properties.autoPlay.value;
                }
                if (properties.interval) {
                    cfgInterval = properties.interval.value * 1000;
                }
                if (properties.playMode) {
                    if (cfgPlayMode !== properties.playMode.value) {
                        cfgPlayMode = properties.playMode.value;
                        needReinit = true;
                    }
                }
                if (properties.fade) {
                    const fadeTime = properties.fade.value;
                    document.getElementById('bg1').style.transition = `opacity ${fadeTime}s ease-in-out`;
                    document.getElementById('bg2').style.transition = `opacity ${fadeTime}s ease-in-out`;
                }

                if (typeof rawImages !== 'undefined' && rawImages.length > 0) {
                    if (needReinit) initPlaylist();
                    startSlideshow();
                }
            }
        };

        // 立即初始化
        if (typeof rawImages !== 'undefined' && rawImages.length > 0) {
            initPlaylist();
            startSlideshow();
        }
    </script>
</body>
</html>
